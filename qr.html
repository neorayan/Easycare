<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyCare QR Code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root{--teal:#0F5E6E;--teal-soft:#E3EFF2;--rust:#A84818;--ink:#1B2430;--muted:#5A6572;--paper:#FFFFFF;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC","Noto Sans Tamil",sans-serif}
html,body{height:100%}
body{margin:0;background:var(--teal-soft);color:var(--ink);font-family:var(--font);display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
.poster{background:var(--paper);border-radius:28px;padding:32px 28px;max-width:440px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;box-sizing:border-box}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rust)}
h1{font-size:34px;line-height:1.1;font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.langs{color:var(--muted);font-size:16px;font-weight:500}
#qr{padding:14px;border:4px solid var(--teal);border-radius:20px;background:#fff;width:100%;max-width:320px;box-sizing:border-box}
#qr img,#qr canvas{display:block;width:100%;height:auto}
#qr canvas[style*="none"]{display:none}
.how{font-size:18px;font-weight:700}
.link{font-size:13px;color:var(--muted);word-break:break-all;user-select:all}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,a.btn{font:inherit;font-weight:800;font-size:15px;color:var(--teal);background:var(--teal-soft);border:0;border-radius:12px;min-height:44px;padding:0 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
</style>
</head>
<body>
<div class="poster">
  <span class="eyebrow">EasyCare Health</span>
  <h1>Health on your phone, made simple</h1>
  <div class="langs">English · 华语 · Melayu · தமிழ்</div>
  <div id="qr" role="img" aria-label="QR code that opens EasyCare Health"></div>
  <div class="how">Point your phone camera here</div>
  <div class="link" id="link"></div>
  <div class="row">
    <button id="copy" type="button">Copy link</button>
    <a class="btn" id="save" download="easycare-qr.png" href="#">Save QR image</a>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// The code always points at the app that sits next to this page, wherever the site is hosted.
const url=location.origin+location.pathname.replace(/[^/]*$/,"");
document.getElementById("link").textContent=url;
new QRCode(document.getElementById("qr"),{text:url,width:640,height:640,colorDark:"#1B2430",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M});
document.getElementById("save").addEventListener("click",e=>{
  const s=document.querySelector("#qr canvas"),c=document.createElement("canvas");c.width=c.height=760;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,760,760);x.drawImage(s,60,60);
  e.currentTarget.href=c.toDataURL("image/png");
});
const b=document.getElementById("copy");
b.addEventListener("click",()=>{navigator.clipboard.writeText(url).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy link",2000)}).catch(()=>{})});
</script>
</body>
</html>
