<title>EasyCare Health</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, big touch targets, one job per screen, help button always at the bottom. */
:root{
  --teal:#0F5E6E; --teal-soft:#E3EFF2; --rust:#A84818; --rust-soft:#FBE8DC;
  --ink:#1B2430; --muted:#5A6572; --line:#C9D0D6; --grey:#F1F3F5; --paper:#FFFFFF; --desk:#E9ECEE;
  --ok:#2E7D5B; --ok-soft:#DDEFE6;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei","Noto Sans Tamil",sans-serif;
  color-scheme:light;
}
html{font-size:18px;height:100%}
html.big{font-size:21px}
body{height:100%;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.35;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
header{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
main>*{flex-shrink:0}
footer{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
h1{font-size:1.45rem;font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem;font-weight:500}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.ic{flex:none}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 14px;border-radius:12px;font-weight:700;font-size:.9rem;background:var(--grey)}
.chip.listen{background:var(--teal-soft);color:var(--teal)}
.chip.listen.on{background:var(--rust-soft);color:var(--rust)}
.chip.line{background:var(--paper);border:2px solid var(--line)}
.grow{flex:1;min-width:0}
.langrow{display:flex;flex-wrap:wrap;gap:6px}
.lchip{min-height:44px;min-width:48px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center}
.lchip.sel{background:var(--ink);border-color:var(--ink);color:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:8px 16px;border-radius:14px;font-weight:800;font-size:1.05rem;text-align:center}
.btn.primary{background:var(--teal);color:#fff}
.btn.help{background:var(--rust);color:#fff}
.btn.outline{border:2.5px solid var(--teal);color:var(--teal);background:var(--paper)}
.btn.quiet{background:var(--grey);min-height:52px;font-size:.95rem}
.btn.danger{color:var(--rust);border:2.5px solid var(--rust);background:var(--paper)}
.btn:disabled{opacity:.4}
.btn:active,.tile:active,.opt:active,.chip:active{transform:scale(.98)}

.banner{display:flex;align-items:center;gap:12px;width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px}
.banner .eyebrow{color:#F3B48E}
.banner b{font-size:1.05rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:150px;padding:14px 8px;border-radius:16px;font-weight:800;font-size:1.05rem;text-align:center;background:var(--teal-soft);line-height:1.2}
.tile.warm{background:var(--rust-soft)}
.tile .disc{width:64px;height:64px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--teal)}
.tile.warm .disc{color:var(--rust)}

.card{border-radius:16px;padding:16px;background:var(--teal-soft);display:flex;flex-direction:column;gap:6px}
.card.grey{background:var(--grey)}
.card.warm{background:var(--rust-soft)}
.card.okc{background:var(--ok-soft)}
.bigdate{font-size:2rem;font-weight:800;line-height:1.05}
.bigtime{font-size:1.4rem;font-weight:800;color:var(--teal)}
.rule{height:2px;background:rgba(15,94,110,.18);margin:6px 0}
.meta{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}

.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--teal)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line);background:var(--paper)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt b{display:block;font-size:1.15rem;font-weight:800}
.opt .sub{display:flex;align-items:center;gap:6px}
.radio{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:#fff}
.opt.sel .radio{background:var(--teal);border-color:var(--teal)}
.box{border-radius:8px}

.slot{display:flex;align-items:center;gap:8px;font-weight:800;margin-top:6px}
.med{display:flex;align-items:center;gap:12px;min-height:80px;padding:12px;border-radius:14px;border:2.5px solid var(--line)}
.med.taken{background:var(--teal-soft);border-color:var(--teal-soft)}
.med b{display:block;font-size:1.1rem;font-weight:800}
.pillpic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--grey);display:grid;place-items:center}
.pillpic i{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:#fff}
.pillpic i.pink{width:16px;height:16px;background:#F3A6B5;border-color:#C96A80}
.medbtn{margin-left:auto;flex:none;min-width:84px;min-height:56px;padding:4px 10px;border-radius:12px;border:2.5px solid var(--teal);color:var(--teal);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.95rem;background:var(--paper)}
.med.taken .medbtn{border-color:transparent;background:none;font-size:.75rem;gap:2px}
.tick{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}

.badge{margin-left:auto;flex:none;padding:6px 12px;border-radius:10px;font-weight:800;font-size:.85rem;color:#fff;background:var(--teal)}
.badge.hi{background:var(--rust)}
.res h2{font-size:1.3rem;font-weight:800;margin:0}
.bar{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:22px}
.bar span{height:12px;border-radius:3px;background:#C9D3DA}
.bar span:nth-child(2){background:#8CC7A9}
.bar span:nth-child(3){background:#E79A6F}
.bar em{position:absolute;top:-16px;transform:translateX(-50%);width:0;height:0;border:8px solid transparent;border-top:11px solid var(--ink);border-bottom:0}
.scale{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.msg{font-weight:700;font-size:1.05rem;margin:6px 0 0}
.val{font-size:.8rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

.shade{position:absolute;inset:0;background:rgba(27,36,48,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto;
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:1.35rem;font-weight:800;margin:0;text-wrap:balance}
.sheet p{margin:0;font-size:1.05rem;font-weight:500}
.bigok{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;align-self:center}
.center{text-align:center;align-items:center}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:9;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;font-weight:700;text-align:center}

.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbtn{min-height:62px;border-radius:12px;border:2.5px solid var(--line);font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--paper)}
.lbtn.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.vbtn{min-height:60px;border-radius:12px;border:2.5px solid var(--line);padding:6px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.95rem;line-height:1.15;background:var(--paper)}
.vbtn small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.vbtn.sel{border-color:var(--rust);background:var(--rust-soft);color:var(--rust)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.num.w{background:var(--rust)}
@media (prefers-reduced-motion:no-preference){.btn,.tile,.opt,.chip{transition:transform .08s}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

/* ---------- dates ---------- */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const plus=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);if(d.getDay()===0)d.setDate(d.getDate()+1);return iso(d)};
const LOC={en:"en-SG",zh:"zh-CN",ms:"ms-MY",ta:"ta-IN"};
const fd=(s,L,o)=>{try{return new Intl.DateTimeFormat(LOC[L],o).format(fromIso(s))}catch(e){return s}};
const dShort=(s,L)=>fd(s,L,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const dLong=(s,L)=>fd(s,L,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function fTime(hm,L){const[h,m]=hm.split(":").map(Number),h12=h%12||12,x=h12+":"+String(m).padStart(2,"0");
 if(L==="zh")return(h<12?"上午":h<18?"下午":"晚上")+" "+x;
 if(L==="ms")return x+" "+(h<12?"pagi":h<19?"petang":"malam");
 if(L==="ta")return(h<12?"காலை":h<18?"மதியம்":"இரவு")+" "+x;
 return x+" "+(h<12?"am":"pm")}

/* ---------- voice ---------- */
function setSpeaking(b){speaking=b;const el=document.getElementById("listenBtn");if(el){el.classList.toggle("on",b);el.innerHTML=ic(b?"stop":"volume",22)+"<span>"+t(b?"stop":"listen")+"</span>"}}
function speak(text,vid){
 const sy=window.speechSynthesis;
 if(!sy||!window.SpeechSynthesisUtterance){toast(t("noVoice"));return}
 sy.cancel();
 const u=new SpeechSynthesisUtterance(text),tags=VOICES[vid].tags,vs=sy.getVoices()||[];let pick=null;
 for(const tg of tags){pick=vs.find(v=>v.lang.toLowerCase().replace("_","-").startsWith(tg));if(pick)break}
 if(vs.length&&!pick){toast(t("noVoice"));return}
 if(pick){u.voice=pick;u.lang=pick.lang}else u.lang=tags.find(x=>x.includes("-"))||tags[0];
 u.rate=.85;u.onend=u.onerror=()=>setSpeaking(false);
 setSpeaking(true);sy.speak(u)}
function hush(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}speaking=false}
try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}

 body:R.map(([k,v,p,hi])=>`<div class="card res ${hi?"warm":""}"><div class="row"><div><h2>${t("r_"+k)}</h2><span class="val">${v}</span></div><span class="badge ${hi?"hi":""}">${t(hi?"abitHigh":"normal")}</span></div>
  <div class="bar"><span></span><span></span><span></span><em style="left:${p}%"></em></div><div class="scale"><span>${t("low")}</span><span>${t("normal")}</span><span>${t("high")}</span></div>
  <p class="msg">${t("m_"+k)}</p></div>`).join(""),
 foot:helpBtn(),
 say:L=>R.map(([k,,,hi])=>t("r_"+k,0,L)+": "+t(hi?"abitHigh":"normal",0,L)+". "+t("m_"+k,0,L))}}
};
function plusBack(n){const d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function stepHead(n,k){return`<div><span class="eyebrow">${t("step",{n})}</span><div class="steps" style="margin:6px 0 10px">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><h1>${t(k)}</h1></div>`}
function summary(a){const L=st.lang;return`<div class="card"><span>${fd(a.date,L,{weekday:"long"})}</span><span class="bigdate">${fd(a.date,L,{day:"numeric",month:"short",year:"numeric"})}</span><span class="bigtime">${fTime(a.time,L)}</span><div class="rule"></div><span class="meta">${ic("heart",20)}${t("t_"+a.type)}</span><span class="meta">${ic("pin",20)}${t("place")}</span></div>`}

function modalHtml(){
 if(!modal)return"";
 let h="";
 if(modal==="help")h=`<h2>${t("helpTitle")}</h2><p>${t("helpBody",{v:VOICES[st.voice].n})}</p><button class="btn help" data-act="callMe">${ic("phone")}${t("callMe")}</button><button class="btn quiet" data-act="closeModal">${t("close")}</button>`;
 if(modal==="helpDone")h=`<span class="bigok">${ic("phone",34)}</span><p class="center" style="font-weight:700">${t("helpDone")}</p><button class="btn primary" data-act="closeModal">${t("ok")}</button>`;
 if(modal==="order"){const names=["Metformin","Amlodipine"];h=`<h2>${t("orderTitle")}</h2>${names.map(n=>{const on=orderSel.includes(n);return`<button class="opt ${on?"sel":""}" data-act="orderPick" data-v="${n}"><span class="pillpic"><i class="${n==="Amlodipine"?"pink":""}"></i></span><span><b>${n}</b><span class="sub">${t(n==="Metformin"?"u_sugar":"u_bp")}</span></span><span class="radio box">${on?ic("check",20):""}</span></button>`}).join("")}<button class="btn primary" data-act="orderSend" ${orderSel.length?"":"disabled"}>${t("sendOrder")}</button><button class="btn quiet" data-act="closeModal">${t("close")}</button>`}
 if(modal==="orderDone")h=`<span class="bigok">${ic("check",40)}</span><h2 class="center">${t("orderDone")}</h2><p class="center"><b>${orderSel.join(" · ")}</b><br>${t("orderInfo",{d:dLong(plus(3),st.lang)})}</p><button class="btn primary" data-act="closeModal">${t("ok")}</button>`;
 if(modal==="cancel"){const a=st.appts.find(x=>x.id===cancelId);h=`<h2>${t("cancelQ")}</h2><p><b>${t("t_"+a.type)}</b><br>${dLong(a.date,st.lang)} · ${fTime(a.time,st.lang)}</p><button class="btn danger" data-act="doCancel">${t("yesCancel")}</button><button class="btn primary" data-act="closeModal">${t("keep")}</button>`}
 return`<div class="shade" data-act="shade"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`}

let lastScreen="";
function render(){
 const cur=nav[nav.length-1],s=SCREENS[cur]();
 document.documentElement.classList.toggle("big",!!st.big);
 document.documentElement.lang=st.lang==="zh"?"zh-Hans":st.lang;
 const app=document.getElementById("app"),old=app.querySelector("main"),keep=old&&cur===lastScreen?old.scrollTop:0;
 app.innerHTML=`<header>${s.head}</header><main>${s.body}</main><footer>${s.foot}</footer>${modalHtml()}${toastMsg?`<div class="toast" role="status">${toastMsg}</div>`:""}`;
 app.querySelector("main").scrollTop=keep;lastScreen=cur;
 if(speaking)setSpeaking(true)}
function toast(m){toastMsg=m;clearTimeout(toastT);toastT=setTimeout(()=>{toastMsg="";render()},3200);render()}
function go(s){hush();nav.push(s);render()}

const ACT={
 go(v){if(v==="book1"){draft={};more=false}go(v)},
 back(){hush();if(nav.length>1)nav.pop();else nav=["home"];render()},
 homeNow(){hush();nav=["home"];render()},
 setLang(v){const D={en:"english",zh:"mandarin",ms:"malay",ta:"tamil"};if(st.voice===D[st.lang])st.voice=D[v];st.lang=v;hush();save();render()},
 goal(v){const i=st.goals.ids.indexOf(v);if(i<0)st.goals.ids.push(v);else st.goals.ids.splice(i,1);save();render()},
 setVoice(v){st.voice=v;save();render();speak(t("sample",0,VOICES[v].base),v)},
 langDone(){hush();st.onboarded=true;save();nav=["home"];render()},
 big(){st.big=!st.big;save();render()},
 listen(){if(speaking){hush();setSpeaking(false);return}speak(SCREENS[nav[nav.length-1]]().say(vbase()).join("。 ").replace(/。 /g,vbase()==="zh"?"。":". "),st.voice)},
 pickType(v){draft.type=v;render()},
 pickSlot(v){[draft.date,draft.time]=v.split("|");render()},
 more(){more=true;render()},
 resched(v){const a=st.appts.find(x=>x.id==v);draft={editId:a.id,type:a.type};more=false;go("book2")},
 confirm(){hush();if(draft.editId){const a=st.appts.find(x=>x.id===draft.editId);if(a){a.date=draft.date;a.time=draft.time}}else st.appts.push({id:Date.now(),type:draft.type,date:draft.date,time:draft.time});save();nav=["home","done"];render()},
 askCancel(v){cancelId=+v;modal="cancel";render()},
 doCancel(){st.appts=st.appts.filter(x=>x.id!==cancelId);save();modal=null;toast(t("cancelled"))},
 take(v){const i=st.taken.ids.indexOf(v);if(i<0)st.taken.ids.push(v);else st.taken.ids.splice(i,1);save();render()},
 order(){orderSel=[];modal="order";render()},
 orderPick(v){const i=orderSel.indexOf(v);if(i<0)orderSel.push(v);else orderSel.splice(i,1);render()},
 orderSend(){modal="orderDone";render()},
 help(){hush();modal="help";render()},
 callMe(){modal="helpDone";render()},
 closeModal(){modal=null;render()},
 shade(v,e){if(e.target.classList.contains("shade")){modal=null;render()}}
};
document.getElementById("app").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;ACT[b.dataset.act](b.dataset.v,e)});
render();
</script>

</body>
</html>
